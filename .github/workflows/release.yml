name: Build installer

# Pokreće se kad napraviš tag oblika v1.0.0 (ili ručno iz taba Actions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # potrebno da se instalacija okači na Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proveri da editor postoji
        shell: bash
        run: |
          if [ ! -f frejmo_edit.html ]; then
            echo "::error::Nedostaje frejmo_edit.html u korenu repozitorijuma"
            exit 1
          fi

      - name: Instaliraj alate
        run: python -m pip install --upgrade pip pyinstaller imageio-ffmpeg

      - name: Napravi program (PyInstaller)
        run: pyinstaller --noconfirm frejmo_edit.spec

      - name: Probni start
        run: dist\FrejmoEdit\FrejmoEdit.exe --version

      - name: Odredi verziju
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Instaliraj Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Napravi instalaciju (Setup.exe)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\frejmo_edit.iss

      - name: Napravi prenosivu verziju (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FrejmoEdit\* -DestinationPath "dist-installer\FrejmoEdit-portable-${{ steps.ver.outputs.v }}.zip"

      - name: Sačuvaj kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FrejmoEdit-windows
          path: dist-installer/*

      - name: Objavi na Release strani
        if: startsWith(github.ref, 'refs/tags/v')
